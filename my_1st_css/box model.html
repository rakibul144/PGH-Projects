<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS BOX MODEL</title>
<style>
    * {
    box-sizing: border-box;
}
.box {
    width: 200px;
    padding: 20px;
    border: 5px solid black;
    margin: 5%;
    background-color: lightblue;
}
</style>
</head>

<body>

    <p class="box">Hello World</p>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
    <style>
        *{
            margin: 10%;
        }
        table, th, td{
            border: 2px solid black;
            /* border ta chokher dag ta ke chikon ba mota kore */
            border-collapse: collapse;
            /* collapse na korle table er border gulo alada alada dekhabe, collapse korle table er border gulo ekta border er moto dekhabe. */
        }
        th, td{
            padding: 10px 20px;
        }
    </style>
</head>
<body>
    
    <h2>Employee Information    </h2>
       <table >
        <caption>Employee Details</caption>
        <!-- caption mane holo table er title. caption ta table er upore dekhabe. caption ta table er upore center e dekhabe. -->
    <thead>
        <tr>
            <td>name</td>
            <th>age</th>
            <td>gender</td>
            <!-- td dileo kaj hobe but table er head e lekha gulo normal text er moto dekhabe ja valo lage na so td er jaygay th lekha thakle table er head er text gulo bold hoye jabe ja valo lage. table er head e td use kora jay but seta valo practice na. table er head e th use kora uchit. table er body te td use kora uchit. table er body te th use kora uchit na. table er body te td use kora uchit. -->

        </tr>
    </thead>
    <tbody>
        <tr>
            <td>jmala</td>
            <td>20</td>
            <td>female</td>
        </tr>
        <tr>
            <td>kmala</td>
            <td>21</td>
            <td>female</td>
        </tr>
        <tr>
            <td>lmala</td>
            <td>22</td>
            <td>female</td>
        </tr>
        <tr>
            <td>mala</td>
            <td>20</td>
            <td>female</td>
        </tr>
        <tr>
            <td>jmal</td>
            <td>20</td>
            <td>male</td>
        </tr>
    </tbody>
    <tfoot>
        <tr>
            <td colspan="3">total people : 5</td>
            <!-- colspan mane holo column span mane holo je td ta 3 column ke cover korbe. jodi amra td te colspan="2" likhi tahole seta 2 column ke cover korbe. jodi amra td te colspan="4" likhi tahole seta 4 column ke cover korbe. jodi amra td te colspan="1" likhi tahole seta 1 column ke cover korbe. jodi amra td te colspan="5" likhi tahole seta 5 column ke cover korbe. jodi amra td te colspan="6" likhi tahole seta 6 column ke cover korbe. jodi amra td te colspan="7" likhi tahole seta 7 column ke cover korbe. jodi amra td te colspan="8" likhi tahole seta 8 column ke cover korbe. jodi amra td te colspan="9" likhi tahole seta 9 column ke cover korbe. jodi amra td te colspan="10" likhi tahole seta 10 column ke cover korbe. jodi amra td te colspan="11" likhi tahole seta 11 column ke cover korbe. jodi amra td te colspan="12" likhi tahole seta 12 column ke cover korbe. jodi amra td te colspan="13" likhi tahole seta 13 column ke cover korbe. jodi amra td te colspan="14" likhi tahole seta 14 column ke cover korbe. jodi amra td te colspan="15" likhi tahole seta 15 column ke cover korbe. jodi amra td te colspan="16" likhi tahole seta 16 column ke cover korbe. jodi amra td te colspan="17" likhi tahole seta 17 column ke cover korbe. jodi amra td te colspan="18" likhi tahole seta 18 column ke cover korbe. jodi amra td te colspan="19" likhi tahole seta 19 column ke cover korbe. jodi amra td te colspan="20" likhi tahole seta 20 column ke cover korbe. -->
       
            
    </tfoot>
    
       </table>
    
</body>
</html>
